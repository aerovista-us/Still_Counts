<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EchoVerse Room — Still Counts</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg:#050404;
  --panel:#11100fdd;
  --panel2:#1b1714dd;
  --line:#d9a97831;
  --text:#f4eadc;
  --muted:#b6a28b;
  --gold:#d9a978;
  --gold2:#f0c899;
  --ink:#070605;
  --warm:#8e5934;
  --danger:#e77765;
  --green:#bfe6bf;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 16% 16%, #70503438, transparent 30%),
    radial-gradient(circle at 72% 80%, #d9a97818, transparent 35%),
    linear-gradient(110deg, #070605, #11100f 48%, #050404);
  overflow-x:hidden;
}
body::before {
  content:"";
  position:fixed; inset:0; pointer-events:none; opacity:.34;
  background:
    linear-gradient(90deg, transparent 0 96%, #ffffff0a 100%),
    linear-gradient(#ffffff08 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at center, #000, transparent 78%);
}
.room {
  width:min(1500px, calc(100% - 32px));
  margin:0 auto;
  padding:24px 0 34px;
  display:grid;
  grid-template-columns: 330px minmax(0, 1fr) 420px;
  gap:18px;
}
.card {
  border:1px solid var(--line);
  background:linear-gradient(180deg, #17120fed, #0b0908ed);
  border-radius:26px;
  box-shadow:0 24px 80px #000b;
  backdrop-filter: blur(18px);
  overflow:hidden;
}
.left {
  min-height:860px;
  padding:0;
}
.leftArt {
  width:100%;
  height:100%;
  min-height:860px;
  object-fit:cover;
  object-position:center top;
  display:block;
}
.main {
  padding:22px;
}
.brand {
  letter-spacing:.55em;
  color:#d8c7b1;
  text-align:center;
  font-size:13px;
  margin-bottom:14px;
}
.cover {
  border:1px solid var(--line);
  border-radius:18px;
  min-height:455px;
  background:#090807;
  overflow:hidden;
  position:relative;
}
.cover img {
  width:100%;
  height:100%;
  min-height:455px;
  object-fit:cover;
  display:block;
  opacity:.82;
  filter:contrast(1.05) saturate(.82);
}
.coverFallback {
  min-height:455px;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 30% 20%, #d9a9782c, transparent 22%),
    linear-gradient(135deg, #0b0b0c, #20160f);
}
.coverTitle {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  background:linear-gradient(180deg, #0002, #0008);
}
.coverTitle h1 {
  font-family:"Brush Script MT", "Segoe Script", cursive;
  font-size:clamp(64px, 8vw, 120px);
  line-height:.78;
  margin:0;
  color:#f4eadc;
  text-shadow:0 10px 40px #000, 0 0 20px #d9a97888;
  transform:rotate(-4deg);
}
.coverTitle p {
  letter-spacing:.34em;
  color:#f3d3aa;
  font-size:13px;
  font-weight:900;
}
.trackName {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:32px;
  margin:18px 0 0;
  color:#f3d3aa;
}
.artist { color:#7e756e; font-size:19px; margin:4px 0 18px; }
.progress {
  display:grid;
  grid-template-columns:60px 1fr 60px;
  gap:12px;
  align-items:center;
  color:#ead8bf;
  font-family:ui-monospace, monospace;
}
input[type=range] { width:100%; accent-color:var(--gold); }
.transport {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:34px;
  margin:24px 0 20px;
}
.iconbtn {
  border:0; background:transparent; color:var(--gold2);
  font-size:29px; cursor:pointer;
}
.play {
  width:78px;height:78px;border-radius:50%;
  border:0; background:linear-gradient(135deg,#f0c899,#bc8652);
  color:#130d08; font-size:28px; cursor:pointer; box-shadow:0 12px 40px #d9a9782b;
}
.panels {
  display:grid;
  grid-template-columns:1.15fr .85fr;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:#100d0bdd;
}
.panel { padding:18px; min-height:230px; }
.panel + .panel { border-left:1px solid var(--line); }
.panel h3 {
  margin:0 0 12px;
  letter-spacing:.3em;
  color:var(--gold);
  text-align:center;
  font-size:14px;
}
svg { width:100%; height:140px; display:block; }
.eqrow {
  display:grid; grid-template-columns:42px 1fr; gap:10px; align-items:center;
  margin:11px 0; color:#cbb69c; font-size:13px;
}
.bottom {
  display:flex; justify-content:space-between; align-items:center; gap:14px;
  margin-top:16px;
}
.btn {
  border:1px solid var(--line);
  background:#1e1712;
  color:#f2d2a8;
  text-decoration:none;
  padding:14px 20px;
  border-radius:12px;
  letter-spacing:.13em;
  font-weight:900;
  cursor:pointer;
}
.quote {
  color:#d9a978;
  font-family:"Segoe Print", cursive;
  font-size:20px;
}
.side {
  padding:22px;
}
.songBox {
  padding:28px 6px 6px;
}
.songBox h2 {
  text-align:center;
  letter-spacing:.36em;
  color:#d9a978;
  font-size:18px;
  margin:0 0 24px;
}
.song {
  display:grid;
  grid-template-columns:32px 1fr 64px;
  gap:12px;
  align-items:center;
  padding:18px;
  border-radius:8px;
  background:#4b321f8c;
  margin-bottom:12px;
  color:#f1ddc2;
  cursor:pointer;
}
.song.active { outline:1px solid #d9a97888; }
.lyrics {
  margin-top:18px;
  max-height:365px;
  overflow:auto;
  padding:18px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#070605a8;
  color:#d9c9b8;
  white-space:pre-wrap;
  line-height:1.5;
  font-size:13px;
}
audio { display:none; }
@media (max-width:1150px) {
  .room { grid-template-columns:1fr; }
  .left { min-height:520px; }
}
@media (max-width:700px) {
  .panels { grid-template-columns:1fr; }
  .panel + .panel { border-left:0; border-top:1px solid var(--line); }
  .bottom { flex-direction:column; align-items:stretch; }
}
</style>
</head>
<body>
<audio id="audio" crossorigin="anonymous"></audio>
<div class="room">
  <aside class="left card">
    <img class="leftArt" src="./assets/echoverse-room-side-panel-4x.png" alt="">
  </aside>

  <main class="main card">
    <div class="brand">ECHOVERSE</div>
    <section class="cover">
      <img src="./assets/still-counts-cover.png" alt="Still Counts album art">
      <div class="coverTitle">
        <div>
          <h1 id="coverText">Still<br>Counts</h1>
          <p id="coverTag">LOVE. COSTS. CHOICES. WE’RE STILL HERE.</p>
        </div>
      </div>
    </section>

    <h1 class="trackName" id="trackName">StillCounts.mp3</h1>
    <div class="artist">EchoVerse</div>

    <div class="progress">
      <span id="currentTime">00:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="duration">00:00</span>
    </div>

    <div class="transport">
      <button class="iconbtn" id="shuffle">⤨</button>
      <button class="iconbtn" id="prev">|‹</button>
      <button class="play" id="playPause">▶</button>
      <button class="iconbtn" id="next">›|</button>
      <button class="iconbtn" id="repeat">↻</button>
    </div>

    <section class="panels">
      <div class="panel">
        <h3>VISUALIZER</h3>
        <svg viewBox="0 0 560 140" aria-label="SVG waveform visualizer">
          <defs>
            <linearGradient id="goldwave" x1="0" x2="1">
              <stop offset="0%" stop-color="#7c4c29"/>
              <stop offset="40%" stop-color="#f0c899"/>
              <stop offset="100%" stop-color="#d9a978"/>
            </linearGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <path id="waveA" fill="none" stroke="url(#goldwave)" stroke-width="3" filter="url(#glow)" />
          <path id="waveB" fill="none" stroke="#f6d8aa88" stroke-width="1.3" />
          <g id="sparkles"></g>
        </svg>
      </div>
      <div class="panel">
        <h3>EQUALIZER <button id="reset" style="float:right;background:#2a211a;border:0;color:#f0c899;border-radius:8px;padding:7px 10px">RESET</button></h3>
        <div class="eqrow"><span>60</span><input class="eq" data-band="60" type="range" min="-12" max="12" value="-2"></div>
        <div class="eqrow"><span>150</span><input class="eq" data-band="150" type="range" min="-12" max="12" value="0"></div>
        <div class="eqrow"><span>400</span><input class="eq" data-band="400" type="range" min="-12" max="12" value="3"></div>
        <div class="eqrow"><span>1K</span><input class="eq" data-band="1000" type="range" min="-12" max="12" value="5"></div>
        <div class="eqrow"><span>6K</span><input class="eq" data-band="6000" type="range" min="-12" max="12" value="0"></div>
      </div>
    </section>

    <div class="bottom">
      <a class="btn" id="download" href="./audio/StillCounts.mp3" download>⇩ DOWNLOAD MP3</a>
      <label style="display:flex;align-items:center;gap:12px;color:#d9a978">🔊 <input id="volume" type="range" min="0" max="1" step=".01" value=".82"></label>
      <div class="quote">“Not healed. Not gone. Just... still here.” ♡</div>
    </div>
  </main>

  <aside class="side card">
    <section class="songBox">
      <h2>SONGS</h2>
      <div class="song active" id="song-still" data-track="still">
        <span>▥</span><strong>StillCounts.mp3</strong><span id="durStill">--:--</span>
      </div>
    </section>

    <section class="lyrics" id="lyrics"></section>
  </aside>
</div>

<script>
const tracks = {
  still: {
    title:"StillCounts.mp3",
    src:"./audio/StillCounts.mp3",
    download:"./audio/StillCounts.mp3",
    cover:"Still\nCounts",
    tag:"LOVE. COSTS. CHOICES. WE’RE STILL HERE.",
    lyrics:`[Intro | low piano loop · room hum · soft static]
Yeah
Still here
Still mean it
Still payin’ for it

[Verse 1 | restrained halftime drums · mellow sub · soft piano]
We keep tryin’, but the tryin’ still costs
Still cross that room, still carry that cross
Still one wrong tone and the air gets thin
Still one old wound and the night caves in
Still you want words in the shape you trust
Still I go quiet when the room gets rough
Still you read distance where I’m holdin’ pain
Still I hear pressure where you’re askin’ plain

And I’d love to tell you we outgrew the drag
That mercy came easy, that we dropped the bag
But truth is smaller and harder than that
We got better at moments, not better like that

Some nights we touch somethin’ honest and clean
Then wake right back up in unfinished scenes
Still mean it, whatever that means
Still two tired hearts in a loud machine

[Pre-Chorus | faint harmony bed]
And I don’t know if this is wisdom
Or fear dressed up as faith
I just know we keep on reachin’
Anyway

[Chorus | wider pads · gentle lift]
We still reach, and it still costs
Still cross that room through the static loss
Still say “stay” when we should say “pause”
Still touch the flame, act surprised by scars
We still mean it, whatever that means
Still wake up inside unfinished scenes
Still don’t know if this is love or fear
But we’re still here
Yeah, we’re still here

[Bridge | beat thins · near-spoken]
Not healed
Not gone
Not right
Not wrong
Not free
Not trapped
Not simple like that
Just two people
Still handin’ each other
Water and fire
At the same time

[Outro | piano decay · soft hum]
Still tryin’
Still tired
Still tender
Still scarred
Still here`
  },
  even: {
    title:"Even.mp3",
    src:"./audio/Even.mp3",
    download:"./audio/Even.mp3",
    cover:"Even",
    tag:"OBJECTIONS. REBUTTALS. QUIET TRUTH.",
    lyrics:`[Hidden Track | Even (Say It Again)]

[Intro | soft female vocal loop · filtered · hypnotic]
I do everything you ask me to…
I do everything you ask me to…

[Verse 1 | HER VOICE · smooth, rational tone]
I do everything you ask me to
I give you space, I don’t push through
I respect your thoughts, I let you breathe
I don’t cross lines, I let you be

You hold onto things from way back then
That’s not fair to who I am right now
If you’d just let go of what it was
We’d probably be okay by now

[Chorus | SPLIT]
HER:
I do everything you ask me to
So why am I still wrong to you?

YOU:
Even just means I stop calling it
Even just means I live with it

[Bridge | YOUR VOICE finally steps forward]
You don’t want “even”
You want it quiet

You don’t want balance
You want me to hide it

You don’t want past gone
You want it unnamed

So it don’t count
When it shows up the same

[Final Chorus | full collision]
HER:
I do everything you ask me to
Why’s it never enough for you?

YOU:
Because “everything” ain’t everything
If it disappears when it gets real

HER:
Then what am I supposed to do?!

YOU:
Stay… when it’s not about you

[Outro]
Only when it doesn’t cost you`
  }
};
let current = "still";
let unlocked = false;
let audioCtx, source, analyser, filters=[], gainNode, data;

const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const seek = document.getElementById("seek");
const volume = document.getElementById("volume");
const lyrics = document.getElementById("lyrics");

function fmt(sec) {
  if (!isFinite(sec)) return "00:00";
  const m = Math.floor(sec/60).toString().padStart(2,"0");
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function loadTrack(name, autoplay=false) {
  if (name === "even" && !unlocked) return;
  current = name;
  const t = tracks[name];
  audio.src = t.src;
  audio.load();
  document.getElementById("trackName").textContent = t.title;
  document.getElementById("download").href = t.download;
  document.getElementById("coverText").textContent = t.cover;
  document.getElementById("coverTag").textContent = t.tag;
  lyrics.textContent = t.lyrics;
  document.getElementById("song-still").classList.toggle("active", name==="still");
  const evenRow = document.getElementById("song-even");
  if (evenRow) evenRow.classList.toggle("active", name==="even");
  if (autoplay) audio.play().catch(()=>{});
}

function ensureHiddenSongRow() {
  let row = document.getElementById("song-even");
  if (row) return row;
  row = document.createElement("div");
  row.className = "song";
  row.id = "song-even";
  row.dataset.track = "even";
  row.innerHTML = `<span>▥</span><strong>Even.mp3</strong><span id="durEven">--:--</span>`;
  row.addEventListener("click", () => loadTrack("even", true));
  document.querySelector(".songBox").appendChild(row);
  return row;
}

function revealHiddenSong(options = {}) {
  if (unlocked) return false;
  unlocked = true;
  ensureHiddenSongRow();
  if (options.autoplay) loadTrack("even", true);
  else if (options.load) loadTrack("even", false);
  return true;
}
window.revealHiddenSong = revealHiddenSong;

loadTrack("still");

function setupAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  source = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  data = new Uint8Array(analyser.frequencyBinCount);

  let chain = source;
  document.querySelectorAll(".eq").forEach((slider) => {
    const f = audioCtx.createBiquadFilter();
    f.type = "peaking";
    f.frequency.value = Number(slider.dataset.band);
    f.Q.value = 1.1;
    f.gain.value = Number(slider.value);
    slider.addEventListener("input", () => f.gain.value = Number(slider.value));
    chain.connect(f);
    chain = f;
    filters.push(f);
  });
  gainNode = audioCtx.createGain();
  gainNode.gain.value = Number(volume.value);
  chain.connect(gainNode);
  gainNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

playPause.addEventListener("click", () => {
  setupAudio();
  if (audioCtx.state === "suspended") audioCtx.resume();
  if (audio.paused) audio.play(); else audio.pause();
});
audio.addEventListener("play", () => playPause.textContent = "Ⅱ");
audio.addEventListener("pause", () => playPause.textContent = "▶");
audio.addEventListener("timeupdate", () => {
  document.getElementById("currentTime").textContent = fmt(audio.currentTime);
  document.getElementById("duration").textContent = fmt(audio.duration);
  if (audio.duration) seek.value = Math.round((audio.currentTime / audio.duration) * 1000);
});
audio.addEventListener("loadedmetadata", () => {
  document.getElementById("duration").textContent = fmt(audio.duration);
  if (current === "still") document.getElementById("durStill").textContent = fmt(audio.duration);
  if (current === "even") document.getElementById("durEven").textContent = fmt(audio.duration);
});
seek.addEventListener("input", () => {
  if (audio.duration) audio.currentTime = (Number(seek.value)/1000) * audio.duration;
});
volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
  if (gainNode) gainNode.gain.value = Number(volume.value);
});
document.querySelectorAll(".song").forEach(row => row.addEventListener("click", () => loadTrack(row.dataset.track, true)));
document.getElementById("prev").addEventListener("click", () => loadTrack("still", true));
document.getElementById("next").addEventListener("click", () => {
  if (unlocked) loadTrack(current === "still" ? "even" : "still", true);
  else loadTrack("still", true);
});
document.getElementById("reset").addEventListener("click", () => {
  const vals = [-2,0,3,5,0];
  document.querySelectorAll(".eq").forEach((s,i)=>{ s.value=vals[i]; if(filters[i]) filters[i].gain.value=vals[i]; });
});

const waveA = document.getElementById("waveA");
const waveB = document.getElementById("waveB");
const sparkles = document.getElementById("sparkles");
for (let i=0;i<48;i++) {
  const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("r", Math.random()*1.8+.4);
  c.setAttribute("cx", Math.random()*560);
  c.setAttribute("cy", Math.random()*140);
  c.setAttribute("fill", "#f0c899");
  c.setAttribute("opacity", Math.random()*.6);
  sparkles.appendChild(c);
}
function animate() {
  let vals = [];
  if (analyser && data) {
    analyser.getByteFrequencyData(data);
    vals = Array.from(data);
  } else {
    const t = Date.now()/450;
    vals = Array.from({length:80}, (_,i)=> 35 + Math.sin(t+i*.23)*28 + Math.sin(t*1.7+i*.51)*14);
  }
  let d1="", d2="";
  for (let i=0;i<112;i++) {
    const x = i*5;
    const amp = (vals[i % vals.length] || 30)/4.7;
    const y1 = 70 + Math.sin(Date.now()/420+i*.18)*amp + Math.cos(Date.now()/740+i*.31)*amp*.34;
    const y2 = 70 + Math.cos(Date.now()/520+i*.2)*amp*.52;
    d1 += `${i?'L':'M'} ${x} ${y1.toFixed(1)} `;
    d2 += `${i?'L':'M'} ${x} ${y2.toFixed(1)} `;
  }
  waveA.setAttribute("d", d1);
  waveB.setAttribute("d", d2);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
